<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محلل ومولد سكربتات روبلوكس</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">
    <div class="max-w-4xl mx-auto space-y-6">
        <header class="flex justify-between items-center border-b border-slate-800 pb-4">
            <h1 class="text-2xl font-bold text-blue-400">محلل أفكار Roblox AI</h1>
            <a href="index.html" class="text-sm text-slate-400 hover:text-white">العودة للرئيسية</a>
        </header>

        <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 space-y-4">
            <label class="block text-sm font-semibold text-slate-300">أدخل فكرة السكربت أو الميكانيكا المطلوبة:</label>
            <textarea id="ideaInput" rows="4" placeholder="مثال: نظام متجر يفتح واجهة GUI للاعبين وعند شراء سيف يخصم من رصيده ويضيفه للحقيبة..." class="w-full bg-slate-900 border border-slate-700 p-3 rounded text-sm focus:outline-none focus:border-blue-500"></textarea>
            <button onclick="analyzeAndGenerate()" class="bg-blue-600 hover:bg-blue-500 px-6 py-2.5 rounded font-bold text-sm transition shadow-lg shadow-blue-600/20">تحليل وتوليد السكربت</button>
        </div>

        <div id="resultsArea" class="hidden space-y-4">
            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 space-y-2">
                <h3 class="font-semibold text-emerald-400 text-sm">كود Luau (Client & Server)</h3>
                <pre id="codeOutput" class="bg-slate-950 p-4 rounded text-xs overflow-x-auto text-emerald-300 font-mono leading-relaxed"></pre>
            </div>

            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 space-y-2">
                <h3 class="font-semibold text-amber-400 text-sm">متطلبات الـ Remote Events</h3>
                <div id="remotesOutput" class="text-sm text-slate-300 bg-slate-950 p-3 rounded font-mono"></div>
            </div>
        </div>
    </div>

    <script>
        function analyzeAndGenerate() {
            const idea = document.getElementById('ideaInput').value;
            if (!idea) return alert('الرجاء كتابة الفكرة أولاً!');

            // محاكاة تحليل الذكاء الاصطناعي للفكرة وإنتاج السكربت المناسب
            const luaScript = `-- فكرة المشروع: ${idea}
local ReplicatedStorage = game:GetService("ReplicatedStorage")
local Players = game:GetService("Players")

-- إنشاء أو جلب الـ RemoteEvent اللازم للتواصل
local remoteFolder = ReplicatedStorage:FindFirstChild("GameRemotes") or Instance.new("Folder", ReplicatedStorage)
remoteFolder.Name = "GameRemotes"

local actionRemote = remoteFolder:FindFirstChild("ExecuteActionEvent") or Instance.new("RemoteEvent", remoteFolder)
actionRemote.Name = "ExecuteActionEvent"

actionRemote.OnServerEvent:Connect(function(player, actionData)
    print("تم استلام الطلب من اللاعب: " .. player.Name)
    -- ضع منطق التنفيذ الخاص بالفكرة هنا
end)`;

            const remotesInfo = `• نوع الـ Remote: RemoteEvent\n• اسم المجلد: GameRemotes (داخل ReplicatedStorage)\n• اسم الـ Event: ExecuteActionEvent`;

            document.getElementById('codeOutput').textContent = luaScript;
            document.getElementById('remotesOutput').textContent = remotesInfo;
            document.getElementById('resultsArea').classList.remove('hidden');
        }
    </script>
</body>
</html>
