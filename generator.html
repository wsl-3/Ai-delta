<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محلل ومولد سكربتات روبلوكس</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen p-6 selection:bg-white selection:text-black">
    <div class="max-w-4xl mx-auto space-y-8">
        <!-- الهيدر -->
        <header class="flex justify-between items-center border-b border-zinc-800 pb-4">
            <h1 class="text-xl font-bold tracking-wide">محلل أفكار Roblox AI</h1>
            <a href="index.html" class="text-sm text-zinc-400 hover:text-white transition">العودة للرئيسية</a>
        </header>

        <!-- صندوق الإدخال -->
        <div class="bg-zinc-950 border border-zinc-800 p-6 rounded-2xl space-y-4">
            <label class="block text-sm font-medium text-zinc-300">أدخل فكرة السكربت أو الميكانيكا المطلوبة:</label>
            <textarea id="ideaInput" rows="4" placeholder="مثال: نظام طيران يجعل اللاعب يرتفع للأعلى عند الضغط على زر مع تأثيرات..." class="w-full bg-black border border-zinc-800 p-4 rounded-xl text-sm text-white placeholder-zinc-600 focus:outline-none focus:border-white transition"></textarea>
            <button onclick="analyzeAndGenerate()" class="bg-white text-black hover:bg-zinc-200 px-6 py-3 rounded-xl font-bold text-sm transition shadow-sm">تحليل وتوليد السكربت</button>
        </div>

        <!-- منطقة النتائج -->
        <div id="resultsArea" class="hidden space-y-6">
            <div class="bg-zinc-950 border border-zinc-800 p-6 rounded-2xl space-y-3">
                <div class="flex justify-between items-center">
                    <h3 class="font-semibold text-white text-sm">كود Luau (Client & Server)</h3>
                    <button onclick="copyCode()" class="text-xs bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 px-3 py-1.5 rounded-lg transition text-zinc-300">نسخ الكود</button>
                </div>
                <pre id="codeOutput" class="bg-black border border-zinc-900 p-4 rounded-xl text-xs overflow-x-auto text-zinc-200 font-mono leading-relaxed"></pre>
            </div>

            <div class="bg-zinc-950 border border-zinc-800 p-6 rounded-2xl space-y-3">
                <h3 class="font-semibold text-white text-sm">متطلبات الـ Remote Events والأماكن</h3>
                <div id="remotesOutput" class="text-sm text-zinc-300 bg-black border border-zinc-900 p-4 rounded-xl font-mono leading-relaxed"></div>
            </div>
        </div>
    </div>

    <script>
        function analyzeAndGenerate() {
            const idea = document.getElementById('ideaInput').value;
            if (!idea) return alert('الرجاء كتابة الفكرة أولاً!');

            const luaScript = `-- فكرة المشروع: ${idea}
local ReplicatedStorage = game:GetService("ReplicatedStorage")
local Players = game:GetService("Players")

-- إعداد مجلد الـ Remotes تلقائياً
local remoteFolder = ReplicatedStorage:FindFirstChild("GameRemotes") or Instance.new("Folder", ReplicatedStorage)
remoteFolder.Name = "GameRemotes"

local actionRemote = remoteFolder:FindFirstChild("ExecuteActionEvent") or Instance.new("RemoteEvent", remoteFolder)
actionRemote.Name = "ExecuteActionEvent"

actionRemote.OnServerEvent:Connect(function(player, actionData)
    print("تم تنفيذ الطلب بنجاح بواسطة: " .. player.Name)
    -- ضع منطق اللعبة هنا
end)`;

            const remotesInfo = `• نوع الـ Remote: RemoteEvent<br>• مكان الـ Folder: ReplicatedStorage<br>• اسم الـ Event: ExecuteActionEvent<br>• إرشادات الاستخدام: ضع هذا الكود في ServerScriptService للتحكم بالخادم.`;

            document.getElementById('codeOutput').textContent = luaScript;
            document.getElementById('remotesOutput').innerHTML = remotesInfo;
            document.getElementById('resultsArea').classList.remove('hidden');
        }

        function copyCode() {
            const codeText = document.getElementById('codeOutput').textContent;
            navigator.clipboard.writeText(codeText);
            alert('تم نسخ الكود بنجاح!');
        }
    </script>
</body>
</html>
