<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>السكربتات المحفوظة</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen p-6 selection:bg-white selection:text-black">
    <div class="max-w-4xl mx-auto space-y-8">
        <!-- الهيدر مع زر البيت -->
        <header class="flex justify-between items-center border-b border-zinc-800 pb-4">
            <div class="flex items-center gap-3">
                <a href="index.html" class="bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 p-2 rounded-xl text-zinc-300 transition" title="الرئيسية">
                    🏠
                </a>
                <h1 class="text-xl font-bold tracking-wide">السكربتات والأفكار المحفوظة</h1>
            </div>
            <a href="generator.html" class="text-sm bg-white text-black font-bold px-4 py-2 rounded-xl hover:bg-zinc-200 transition">توليد جديد ✨</a>
        </header>

        <!-- قائمة المحفوظات -->
        <div id="savedContainer" class="space-y-6">
            <!-- سيتم تعبئتها تلقائياً -->
        </div>
    </div>

    <script>
        function loadSavedScripts() {
            const container = document.getElementById('savedContainer');
            const savedScripts = JSON.parse(localStorage.getItem('robloxSavedScripts') || '[]');

            if (savedScripts.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16 bg-zinc-950 border border-zinc-800 rounded-2xl space-y-3">
                        <p class="text-zinc-400 text-sm">لا توجد أي سكربتات محفوظة حتى الآن.</p>
                        <a href="generator.html" class="inline-block text-xs bg-white text-black font-bold px-4 py-2 rounded-xl">ابدأ بتوليد أول سكربت</a>
                    </div>`;
                return;
            }

            container.innerHTML = '';
            savedScripts.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = "bg-zinc-950 border border-zinc-800 p-6 rounded-2xl space-y-4";
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-xs text-zinc-500">${item.date || ''}</span>
                            <h3 class="font-semibold text-white text-sm mt-1">الفكرة: ${item.idea}</h3>
                        </div>
                        <button onclick="deleteScript(${index})" class="text-xs bg-red-950 border border-red-900 text-red-400 hover:bg-red-900 px-3 py-1.5 rounded-lg transition">حذف</button>
                    </div>
                    <div class="space-y-2">
                        <h4 class="text-xs text-zinc-400">كود Luau:</h4>
                        <pre class="bg-black border border-zinc-900 p-4 rounded-xl text-xs overflow-x-auto text-zinc-200 font-mono leading-relaxed">${item.code}</pre>
                    </div>
                    <div class="space-y-1">
                        <h4 class="text-xs text-zinc-400">الـ Remotes المطلوبة:</h4>
                        <div class="text-sm text-zinc-300 bg-black border border-zinc-900 p-3 rounded-xl font-mono">${item.remotes}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function deleteScript(index) {
            let savedScripts = JSON.parse(localStorage.getItem('robloxSavedScripts') || '[]');
            savedScripts.splice(index, 1);
            localStorage.setItem('robloxSavedScripts', JSON.stringify(savedScripts));
            loadSavedScripts();
        }

        loadSavedScripts();
    </script>
</body>
</html>
